<div class="page-wrapper">

  <!-- Page Header -->
  <div class="page-header">
    <h2 class="page-title">Insurance Form List</h2>
    <div class="page-actions">
      <div class="search-box">
        <mat-icon>search</mat-icon>
        <input type="text" placeholder="Search forms..." (keyup)="applyFilter($event)" #input>
      </div>
      <button class="btn-action btn-create" (click)="OnAddInsurance()">
        <mat-icon style="font-size:16px;width:16px;height:16px">add</mat-icon> Create
      </button>
      <button class="btn-action btn-excel" (click)="OnExportExcel()">
        <mat-icon style="font-size:16px;width:16px;height:16px">download</mat-icon> Export
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource" class="nmg-table" id="excel-table">

        <ng-container matColumnDef="SrNo">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
        </ng-container>

        <ng-container matColumnDef="UniqueId">
          <th mat-header-cell *matHeaderCellDef>Unique ID</th>
          <td mat-cell *matCellDef="let element"><code style="font-size:0.8rem;color:#374151">{{ element.uniqueId }}</code></td>
        </ng-container>

        <ng-container matColumnDef="Date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let element">{{ element.Date | date:'mediumDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="Verification">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let element">
            <span *ngIf="element.isVerified" class="badge-verified">✔ Verified</span>
            <span *ngIf="!element.isVerified" class="badge-pending">⧗ Pending</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="FullName">
          <th mat-header-cell *matHeaderCellDef>Full Name</th>
          <td mat-cell *matCellDef="let element">{{ element.fullName }}</td>
        </ng-container>

        <ng-container matColumnDef="Contact">
          <th mat-header-cell *matHeaderCellDef>Contact</th>
          <td mat-cell *matCellDef="let element">{{ element.contactOne }}</td>
        </ng-container>

        <ng-container matColumnDef="Actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <button class="icon-btn edit-btn" title="Edit" (click)="OnEditInsurance(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button class="icon-btn delete-btn" title="Delete" (click)="OnDeleteInsurance(element)">
              <mat-icon>delete</mat-icon>
            </button>
            <button class="icon-btn view-btn" title="View" (click)="OnViewInsurance(element)">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data-cell" colspan="7">
            No records matching &ldquo;{{ input.value }}&rdquo;
          </td>
        </tr>
      </table>
    </div>
  </div>

</div>
