
<mat-drawer-container>

  <mat-drawer mode="side" [opened]="sidebarOpen">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-icon">
        <mat-icon>phone_android</mat-icon>
      </div>
      <div class="brand-text">
        <span class="brand-name">NMG</span>
        <span class="brand-full">Nicks Mobile Gallery</span>
      </div>
    </div>

    <!-- Role badge -->
    <div class="role-badge-wrap">
      <span class="role-badge">
        <mat-icon class="role-icon">manage_accounts</mat-icon>
        {{ userRole | titlecase }}
      </span>
    </div>

    <div class="sidebar-divider"></div>

    <!-- Nav items -->
    <nav class="sidebar-nav">
      <a *ngFor="let item of sidebarItems"
         class="nav-item"
         [routerLink]="getFullPath(item)"
         routerLinkActive="nav-item-active">
        <span class="nav-icon-wrap">
          <mat-icon>{{ item.icon }}</mat-icon>
        </span>
        <span class="nav-label">{{ item.moduleName }}</span>
      </a>
    </nav>

    <!-- Bottom spacer -->
    <div class="sidebar-footer">
      <span class="footer-version">v2.0</span>
    </div>

  </mat-drawer>

  <mat-drawer-content>
    <app-navbar (toggleSidebar)="sidebarToggeler()"></app-navbar>
    <router-outlet></router-outlet>
  </mat-drawer-content>

</mat-drawer-container>
