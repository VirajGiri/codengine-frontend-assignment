<div class="login-page">

  <!-- Brand -->
  <div class="login-brand">
    <div class="brand-icon">
      <mat-icon>phone_android</mat-icon>
    </div>
    <h1 class="brand-name">NICKS MOBILE GALLERY</h1>
    <p class="brand-sub">Management Portal</p>
  </div>

  <!-- Card -->
  <div class="login-card">
    <h2 class="login-title">Sign In</h2>
    <p class="login-subtitle">Enter your credentials to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="field-group">
        <label class="field-label">Email Address</label>
        <input type="email" class="field-input"
          placeholder="name@example.com"
          formControlName="Email"
          [class.field-error]="submitted && f['Email'].errors">
        <div class="error-msg" *ngIf="submitted && f['Email'].errors">
          <span *ngIf="f['Email'].errors['required']">Email is required</span>
          <span *ngIf="f['Email'].errors['email']">Enter a valid email</span>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <input type="password" class="field-input"
          placeholder="Password"
          formControlName="password"
          [class.field-error]="submitted && f['password'].errors">
        <div class="error-msg" *ngIf="submitted && f['password'].errors">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
          <span *ngIf="f['password'].errors['minlength']">Minimum 4 characters</span>
        </div>
      </div>

      <button type="submit" class="login-btn">Sign In</button>

    </form>
  </div>

</div>
