<app-dialog-nav [title]="title"></app-dialog-nav>

<div class="dlg-wrapper">
  <div class="dlg-header">
    <span class="dlg-title">{{ operation }} User</span>
  </div>

  <form [formGroup]="userForm" novalidate class="dlg-body">

    <!-- Row 1: Name, Role, Mobile -->
    <div class="form-grid">
      <div class="field-group">
        <label class="field-label">Full Name</label>
        <input class="field-input" type="text" formControlName="Name" placeholder="Enter name">
      </div>

      <div class="field-group" *ngIf="isAddUser">
        <label class="field-label">Role</label>
        <select class="field-input field-select" formControlName="Role">
          <option value="">Select Role</option>
          <option *ngFor="let r of userRoles" [value]="r">{{ r | titlecase }}</option>
        </select>
      </div>
      <div class="field-group" *ngIf="!isAddUser">
        <label class="field-label">Role</label>
        <input class="field-input" type="text" formControlName="Role" readonly>
      </div>

      <div class="field-group">
        <label class="field-label">Mobile No</label>
        <input class="field-input" type="tel" formControlName="MobileNo" placeholder="Mobile number">
      </div>

      <div class="field-group" *ngIf="isAddUser">
        <label class="field-label">Email</label>
        <input class="field-input" [class.field-error]="isSubmitted && isError.username"
               type="email" formControlName="Email" placeholder="Email address">
        <span class="field-error-msg" *ngIf="isSubmitted && isError.username">Email is already registered.</span>
      </div>
      <div class="field-group" *ngIf="!isAddUser">
        <label class="field-label">Email</label>
        <input class="field-input" type="email" formControlName="Email" readonly>
      </div>
    </div>

    <div class="section-divider">Address</div>

    <!-- Row 2: Address -->
    <div class="form-grid">
      <div class="field-group field-full">
        <label class="field-label">Address</label>
        <input class="field-input" type="text" formControlName="Address" placeholder="Street address">
      </div>
      <div class="field-group field-full">
        <label class="field-label">Landmark / Address 2</label>
        <input class="field-input" type="text" formControlName="Landmark" placeholder="Apartment, floor, etc.">
      </div>
      <div class="field-group">
        <label class="field-label">City</label>
        <input class="field-input" type="text" formControlName="City" placeholder="City">
      </div>
      <div class="field-group">
        <label class="field-label">State</label>
        <select class="field-input field-select" formControlName="State">
          <option value="Maharashtra">Maharashtra</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">ZIP</label>
        <input class="field-input" type="text" formControlName="Zip" placeholder="ZIP">
      </div>
    </div>

  </form>

  <div class="dlg-footer">
    <button class="dlg-btn dlg-btn-primary" *ngIf="isAddUser" (click)="onCreateUser()">
      <mat-icon style="font-size:16px;width:16px;height:16px">person_add</mat-icon> Create User
    </button>
    <button class="dlg-btn dlg-btn-primary" *ngIf="!isAddUser" (click)="onUpdateUser()">
      <mat-icon style="font-size:16px;width:16px;height:16px">save</mat-icon> Save Changes
    </button>
  </div>
</div>
