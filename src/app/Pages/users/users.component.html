<div class="page-wrapper">

  <!-- Page Header -->
  <div class="page-header">
    <h2 class="page-title">Users</h2>
    <div class="page-actions">
      <div class="search-box">
        <mat-icon>search</mat-icon>
        <input type="text" placeholder="Search users..." (keyup)="applyFilter($event)" #input>
      </div>
      <button class="btn-action btn-create" (click)="OnCreateUser()">
        <mat-icon style="font-size:16px;width:16px;height:16px">person_add</mat-icon> Add User
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource" class="nmg-table">

        <ng-container matColumnDef="SrNo">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
        </ng-container>

        <ng-container matColumnDef="Name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">
            <div class="user-name-cell">
              <span class="user-avatar">{{ element.Name?.charAt(0) | uppercase }}</span>
              {{ element.Name }}
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="Role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let element">
            <span class="role-chip">{{ element.Role | titlecase }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="Username">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let element">{{ element.username }}</td>
        </ng-container>

        <ng-container matColumnDef="MobileNo">
          <th mat-header-cell *matHeaderCellDef>Mobile</th>
          <td mat-cell *matCellDef="let element">{{ element.MobileNo || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="BranchCity">
          <th mat-header-cell *matHeaderCellDef>Branch City</th>
          <td mat-cell *matCellDef="let element">
            <span *ngIf="element.BranchCity" class="city-badge">
              <span class="city-dot"></span>{{ element.BranchCity }}
            </span>
            <span *ngIf="!element.BranchCity" class="no-val">—</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="Actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <button class="icon-btn edit-btn" title="Edit" (click)="OnEditUser(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button class="icon-btn delete-btn" title="Delete" (click)="OnDeleteUser(element)">
              <mat-icon>delete</mat-icon>
            </button>
            <button class="icon-btn view-btn" title="View" (click)="OnViewUser(element)">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data-cell" colspan="7">
            No users matching &ldquo;{{ input.value }}&rdquo;
          </td>
        </tr>
      </table>
    </div>
  </div>

</div>
