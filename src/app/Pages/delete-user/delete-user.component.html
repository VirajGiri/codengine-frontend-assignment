<div class="confirm-dlg">
  <div class="confirm-icon">
    <mat-icon>person_remove</mat-icon>
  </div>
  <h3 class="confirm-title">Delete User</h3>
  <p class="confirm-msg">This action cannot be undone. Are you sure you want to delete this user?</p>
  <div class="confirm-actions">
    <button class="conf-btn conf-cancel" [mat-dialog-close]="true">Cancel</button>
    <button class="conf-btn conf-delete" mat-dialog-close (click)="onSubmit()">
      <mat-icon style="font-size:16px;width:16px;height:16px">delete</mat-icon> Delete
    </button>
  </div>
</div>
